name: Laboratorio Forense - CI
on:
  push:
    branches: [laboratorio-forense-streamlit-v2]
    paths:
      - 'laboratorio-forense/**'
      - '.github/workflows/laboratorio-forense-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'laboratorio-forense/**'
      - '.github/workflows/laboratorio-forense-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: laboratorio-forense
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: laboratorio-forense/requirements.txt
      - name: Install required Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify installed dependencies
        run: |
          python - <<'PY'
          import importlib.util
          names=['streamlit','pandas','sklearn','pypdf','docx','spacy',
                 'nltk','sentence_transformers','rapidfuzz','networkx',
                 'plotly','librosa','soundfile','faster_whisper','requests','bs4']
          for name in names:
              assert importlib.util.find_spec(name), f'NOT INSTALLED: {name}'
              print(name, 'OK')
          PY
      - name: Compile Python
        run: python -m compileall -q app.py engine.py fontes.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Streamlit app test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py").run(timeout=40)
          assert not app.exception, [str(x.message) for x in app.exception]
          print('Streamlit AppTest OK')
          PY
      - name: Server HTTP smoke test
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/forense-streamlit.log 2>&1 &
          echo $! > /tmp/forense-streamlit.pid
          python - <<'PY'
          import time, urllib.request
          for i in range(35):
              try:
                  data=urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=2).read()
                  assert b'ok' in data.lower()
                  print('Streamlit HTTP health OK')
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('Streamlit did not become healthy')
          PY

      - name: Retrieve a real official Portuguese transcript
        run: |
          python - <<'PY'
          from fontes import catalogo, obter_texto
          source=catalogo()[0]
          text=obter_texto(source, timeout=30)
          assert len(text)>1000, len(text)
          assert "O SR." in text or "A SRA." in text
          print("SENADO LIVE SOURCE OK:", source["id"], len(text), "characters")
          PY

      - name: Retrieve real Brazilian criminal interrogations
        run: |
          python - <<'PY'
          from casos_criminais import CASOS, obter_interrogatorio
          for case in CASOS:
              statement=obter_interrogatorio(case, timeout=40)
              assert 850<len(statement)<15000, (case.id,len(statement))
              assert statement.count("RESPONDEU:")>=5, case.id
              assert "SENTENÇA" not in statement.upper(), case.id
              print("CRIMINAL CASE",case.id,"OK",len(statement),"characters")
          PY
